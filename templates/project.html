<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ author }}</title>
<meta name="description" content="{{ description }}">
<meta property="og:title" content="{{ title }} · {{ author }}">
<meta property="og:description" content="{{ description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17202b; --muted: #556070; --faint: #8a94a2; --rule: #dde3ea;
    --bg: #ffffff; --bg-soft: #f7f8fa; --accent: #b4541a; --accent-soft: #fbede3; --navy: #172340;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; line-height: 1.7;
  }
  a { color: var(--accent); }
  .top { border-bottom: 1px solid var(--rule); background: #fff; position: sticky; top: 0; z-index: 5; }
  .top .wrap { display: flex; justify-content: space-between; align-items: center; height: 56px; gap: 12px; }
  .top a { text-decoration: none; font-weight: 600; font-size: 14px; }
  .brand { font-family: "Source Serif 4", Georgia, serif; font-size: 18px; color: var(--ink); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .tabs { display: flex; gap: 8px; margin: 28px 0 0; flex-wrap: wrap; }
  .tabs a { padding: 6px 14px; border-radius: 99px; border: 1px solid var(--rule); color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; }
  .tabs a.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  article { padding: 18px 0 60px; }
  article > p:first-child { color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: 1.1px; text-transform: uppercase; margin-bottom: 0; }
  h1 { color: var(--navy); font-family: "Source Serif 4", Georgia, serif; font-size: clamp(32px, 5vw, 46px); line-height: 1.12; margin: 8px 0 16px; }
  h1 + p { font-size: 20px; color: var(--ink); }
  h2 { color: var(--navy); font-family: "Source Serif 4", Georgia, serif; font-size: 28px; margin: 48px 0 6px; padding-top: 10px; }
  h3 { font-size: 19px; margin: 10px 0 14px; color: var(--muted); font-weight: 600; }
  h4 { font-size: 17px; margin: 22px 0 6px; }
  p, li { color: #2b3542; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 40px 0 8px; }
  blockquote {
    margin: 22px 0; padding: 14px 18px; background: var(--accent-soft); border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
  }
  blockquote p { margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 15px; display: block; overflow-x: auto; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { background: var(--bg-soft); font-weight: 600; white-space: nowrap; }
  code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 14px; background: var(--bg-soft); padding: 2px 5px; border-radius: 4px; }
  pre { background: #0f1a22; color: #e6edf3; padding: 16px 18px; border-radius: 10px; overflow-x: auto; font-size: 14px; line-height: 1.55; }
  pre code { background: none; padding: 0; color: inherit; }
  .foot { border-top: 1px solid var(--rule); padding: 26px 0 40px; color: var(--faint); font-size: 14px; }
  .foot .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <a class="brand" href="{{ hub_url }}">{{ author }}</a>
    <a href="{{ hub_url }}#work">← All work</a>
  </div>
</div>
<div class="wrap">
  <div class="tabs">
    {% if has_visual %}<a href="index.html">At a glance</a>{% endif %}
    <a href="{{ 'story.html' if has_visual else 'index.html' }}" class="{{ 'on' if page == 'story' else '' }}">The story</a>
    {% if has_technical %}<a href="technical.html" class="{{ 'on' if page == 'technical' else '' }}">Technical deep dive</a>{% endif %}
  </div>
  <article>{{ body | safe }}</article>
</div>
<div class="foot">
  <div class="wrap">
    <span>{{ author }} · <a href="{{ hub_url }}">Portfolio</a> · <a href="{{ linkedin_url }}">LinkedIn</a></span>
    <span>Illustrative figures; confidential details omitted.</span>
  </div>
</div>
</body>
</html>
